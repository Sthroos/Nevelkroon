<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>Nevelkroon</title>
<style>:root {
  --bg: rgba(9, 13, 28, 0.86);
  --bg2: rgba(20, 28, 54, 0.9);
  --line: rgba(140, 170, 255, 0.18);
  --line2: rgba(140, 170, 255, 0.35);
  --txt: #e6ebfa;
  --dim: #94a0c4;
  --mint: #8cffc8;
  --gold: #f2c14e;
  --red: #ff6b6b;
  --E: #ffd65a; --M: #ff9f5a; --R: #6fc8ff; --I: #d79bff;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; color: var(--txt);
  font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font: inherit; color: inherit; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#map.drag { cursor: grabbing; }
.hidden { display: none !important; }

/* ---------- Buttons ---------- */
.btn { background: linear-gradient(180deg, rgba(60, 80, 140, 0.55), rgba(30, 40, 80, 0.65)); border: 1px solid var(--line2);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: transform .08s, background .2s, border-color .2s; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--mint); background: linear-gradient(180deg, rgba(70, 100, 170, 0.7), rgba(35, 50, 100, 0.8)); }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #2fbf8a, #18805c); border-color: #6fffc4; color: #031a10; font-weight: 700; }
.btn.danger { background: linear-gradient(180deg, #c0423f, #7c2321); border-color: #ff8a86; }
.btn.gold { background: linear-gradient(180deg, #e8b442, #9a6c14); border-color: #ffe08a; color: #1d1200; font-weight: 700; }
.btn.small { padding: 5px 9px; font-size: 12.5px; border-radius: 8px; }
.btn.icon { width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; font-size: 18px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; }
.dim { color: var(--dim); }
.small { font-size: 12.5px; }
.tiny { font-size: 11px; }
.r-E { color: var(--E); } .r-M { color: var(--M); } .r-R { color: var(--R); } .r-I { color: var(--I); }
.neg { color: var(--red) !important; }
.pos { color: var(--mint); }
.bar { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #4ad7a0, #8cffc8); border-radius: 4px; transition: width .4s; }
.bar.red > i { background: linear-gradient(90deg, #c33, #ff7b6b); }
.bar.blue > i { background: linear-gradient(90deg, #3a8cff, #7cc8ff); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11.5px; border: 1px solid var(--line2); background: rgba(255,255,255,0.05); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 4px; box-shadow: 0 0 6px currentColor; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: .3px; }
h3 { font-size: 15px; }
h4 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.2px; margin-top: 4px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; width: 100%; }

/* ---------- Top bar ---------- */
#top { position: fixed; top: 0; left: 0; right: 0; padding: calc(8px + var(--safe-t)) 10px 8px; display: flex; gap: 8px; align-items: center;
  background: linear-gradient(180deg, rgba(4, 6, 16, 0.92), rgba(4, 6, 16, 0.55) 75%, rgba(4,6,16,0)); z-index: 10; pointer-events: none; }
#top > * { pointer-events: auto; }
.res { display: flex; gap: 6px; }
.res .r { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; min-width: 78px; cursor: help; }
.res .r b { font-size: 15px; }
.res .r .inc { font-size: 11.5px; margin-left: 4px; }
.res .r .ic { margin-right: 4px; }
#turnlbl { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-weight: 700; }
#researchBtn { min-width: 170px; text-align: left; }
#researchBtn .bar { margin-top: 3px; }
#topBtns { display: flex; gap: 6px; margin-left: auto; }

/* ---------- Banners ---------- */
#banners { position: fixed; top: calc(62px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 9; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.banner { background: rgba(60, 10, 40, 0.88); border: 1px solid #ff4fbf; padding: 6px 14px; border-radius: 10px; font-weight: 600; box-shadow: 0 0 20px rgba(255, 47, 176, 0.35); }
.banner.kroon { background: rgba(10, 50, 60, 0.9); border-color: #66f0ff; box-shadow: 0 0 20px rgba(102, 240, 255, 0.35); }
.banner.dom { background: rgba(60, 40, 5, 0.9); border-color: var(--gold); box-shadow: 0 0 20px rgba(242, 193, 78, 0.35); }

/* ---------- Panel ---------- */
#panel { position: fixed; right: 10px; top: calc(64px + var(--safe-t)); width: 360px; max-height: calc(100% - 180px); overflow-y: auto; overflow-x: hidden;
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px; z-index: 8; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5); touch-action: pan-y; user-select: text; }
#panel .phead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
#panel .phead h2 { font-size: 18px; }
#panel .close { margin-left: auto; }
.planet { display: flex; gap: 10px; align-items: center; padding: 7px; border-radius: 10px; border: 1px solid transparent; }
.planet:hover { background: rgba(255,255,255,0.03); }
.planet.mine { border-color: var(--line2); background: rgba(140,255,200,0.04); }
.pball { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset -6px -4px 10px rgba(0,0,0,0.6), 0 0 8px rgba(255,255,255,0.08); }
.blds { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 6px; }
.bld { background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; padding: 6px; font-size: 12px; text-align: left; cursor: pointer; }
.bld:hover:not(:disabled) { border-color: var(--mint); }
.bld:disabled { opacity: 0.4; cursor: not-allowed; }
.bld b { display: block; font-size: 12.5px; }
.slot { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 7px; background: rgba(255,255,255,0.06); font-size: 12px; margin: 2px; }
.q { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; }
.q .bar { flex: 1; }
.fleetrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; background: rgba(255,255,255,0.03); margin: 3px 0; cursor: pointer; border: 1px solid transparent; }
.fleetrow:hover { border-color: var(--line2); }
.ships { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; }

/* ---------- End turn + chips ---------- */
#endturn { position: fixed; right: 16px; bottom: calc(16px + var(--safe-b)); width: 92px; height: 92px; border-radius: 50%; z-index: 9;
  background: radial-gradient(circle at 35% 30%, #4fe3ad, #127451 70%); border: 2px solid #9fffd6; color: #021a10; font-weight: 800; cursor: pointer;
  box-shadow: 0 0 30px rgba(80, 255, 180, 0.45), inset 0 -6px 16px rgba(0,0,0,0.35); display: grid; place-items: center; line-height: 1.05; font-size: 13px; text-align: center; transition: transform .1s, filter .2s; }
#endturn:active { transform: scale(0.94); }
#endturn:disabled { filter: grayscale(0.8) brightness(0.6); cursor: wait; }
#endturn big { font-size: 22px; display: block; }
#chips { position: fixed; right: 118px; bottom: calc(22px + var(--safe-b)); z-index: 9; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.chip { background: var(--bg); border: 1px solid var(--line2); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
.chip:hover { border-color: var(--mint); }
.chip.warn { border-color: var(--gold); }
#leftBtns { position: fixed; left: 12px; bottom: calc(16px + var(--safe-b)); z-index: 9; display: flex; flex-direction: column; gap: 8px; }

/* ---------- Toasts ---------- */
#toasts { position: fixed; left: 12px; top: calc(66px + var(--safe-t)); z-index: 45; display: flex; flex-direction: column; gap: 6px; max-width: min(420px, 70vw); pointer-events: none; }
.toast { background: var(--bg); border: 1px solid var(--line2); border-left: 4px solid var(--mint); border-radius: 10px; padding: 7px 11px; font-size: 13px;
  animation: tin .3s ease-out; box-shadow: 0 6px 20px rgba(0,0,0,0.45); pointer-events: auto; cursor: pointer; }
.toast.war, .toast.combat { border-left-color: var(--red); }
.toast.crisis { border-left-color: #ff2fb0; }
.toast.big { border-left-color: var(--gold); }
.toast.tech { border-left-color: var(--R); }
.toast.err { border-left-color: var(--red); background: rgba(60, 10, 10, 0.92); }
@keyframes tin { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }

/* ---------- Modal ---------- */
#modal { position: fixed; inset: 0; z-index: 40; background: rgba(2, 3, 10, 0.68); display: grid; place-items: center; padding: 14px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.mbox { background: linear-gradient(180deg, rgba(16, 22, 46, 0.97), rgba(8, 11, 26, 0.97)); border: 1px solid var(--line2); border-radius: 16px; width: min(760px, 100%);
  max-height: calc(100vh - 40px - var(--safe-t) - var(--safe-b)); overflow-y: auto; padding: 18px; box-shadow: 0 20px 70px rgba(0,0,0,0.7); animation: pop .22s ease-out; touch-action: pan-y; user-select: text; }
.mbox.narrow { width: min(480px, 100%); }
.mhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.mhead h2 { font-size: 20px; }
.mhead .close { margin-left: auto; }
@keyframes pop { from { opacity: 0; transform: scale(0.95) translateY(8px); } to { opacity: 1; transform: none; } }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; position: relative; overflow: hidden; transition: transform .12s, border-color .2s; }
.card:hover:not(.off) { border-color: var(--mint); transform: translateY(-2px); }
.card.sel { border-color: var(--mint); box-shadow: 0 0 0 1px var(--mint), 0 0 24px rgba(140,255,200,0.2); }
.card.off { opacity: 0.45; cursor: default; }
.card .cat { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs .btn.on { border-color: var(--mint); background: linear-gradient(180deg, rgba(60, 140, 110, 0.6), rgba(25, 70, 55, 0.7)); }
.emp { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg2); margin-bottom: 10px; }
.emblem { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; font-weight: 900; color: #04060f; }
.logline { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; cursor: pointer; }
.logline .t { color: var(--dim); font-size: 11px; margin-right: 6px; }
table.st { width: 100%; border-collapse: collapse; font-size: 13px; }
table.st td, table.st th { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); text-align: left; }
table.st th { color: var(--dim); font-weight: 600; font-size: 12px; }
input[type=text] { background: rgba(0,0,0,0.35); border: 1px solid var(--line2); border-radius: 9px; padding: 8px 10px; color: var(--txt); font: inherit; width: 100%; user-select: text; }
input[type=range] { width: 100%; accent-color: var(--mint); }
textarea { width: 100%; min-height: 120px; background: rgba(0,0,0,0.35); color: var(--txt); border: 1px solid var(--line2); border-radius: 9px; font: 12px monospace; user-select: text; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 7px 12px; cursor: pointer; color: var(--dim); }
.seg button.on { background: rgba(140,255,200,0.16); color: var(--txt); font-weight: 700; }
.evimg { height: 120px; border-radius: 12px; margin-bottom: 12px; overflow: hidden; position: relative; }

/* ---------- Title ---------- */
#title { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(2,3,10,0.1), rgba(2,3,10,0.75)); padding: 20px; overflow-y: auto; touch-action: pan-y; }
.logo { font-size: clamp(42px, 10vw, 92px); font-weight: 900; letter-spacing: clamp(4px, 1.6vw, 16px); text-align: center;
  background: linear-gradient(180deg, #fff7d6 10%, #f2c14e 45%, #66f0ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 24px rgba(242,193,78,0.35)); margin: 0; }
.sub { text-align: center; color: #b9c5ea; letter-spacing: 4px; text-transform: uppercase; font-size: 13px; margin-bottom: 26px; }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(320px, 90vw); margin: 0 auto; }
.menu .btn { padding: 13px; font-size: 16px; }
.setup { width: min(980px, 100%); background: rgba(8, 11, 26, 0.9); border: 1px solid var(--line2); border-radius: 18px; padding: 18px; }
.fcard { min-height: 170px; }
.fcard .emblem { width: 40px; height: 40px; font-size: 20px; border-radius: 10px; }
.fcard ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: #c9d3f0; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 14px 0; }
.lore { color: #c9d3f0; max-width: 620px; text-align: center; margin: 0 auto 22px; font-size: 14px; line-height: 1.6; }

/* ---------- Mobile ---------- */
@media (max-width: 760px) {
  #top { flex-wrap: wrap; gap: 5px; padding-left: 6px; padding-right: 6px; }
  .res { width: 100%; gap: 4px; }
  .res .r { flex: 1; min-width: 0; padding: 3px 5px; text-align: center; }
  .res .r b { font-size: 13px; }
  .res .r .inc { display: block; margin: 0; font-size: 10.5px; }
  #turnlbl { padding: 5px 8px; font-size: 13px; }
  #researchBtn { min-width: 0; flex: 1; font-size: 12px; padding: 6px 8px; }
  #topBtns .btn.icon { width: 36px; height: 36px; font-size: 16px; }
  #topBtns { margin-left: 0; }
  #banners { top: calc(104px + var(--safe-t)); width: 94vw; }
  #panel { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 50vh; border-radius: 16px 16px 0 0; padding-bottom: calc(12px + var(--safe-b)); }
  body.panel-open #endturn { bottom: calc(50vh + 10px); width: 74px; height: 74px; }
  body.panel-open #chips, body.panel-open #leftBtns { display: none; }
  #endturn { width: 80px; height: 80px; }
  #chips { right: 104px; }
  #toasts { top: calc(108px + var(--safe-t)); max-width: 86vw; }
  .mbox { padding: 14px; border-radius: 14px; }
  .cards { grid-template-columns: 1fr; }
  .setup .cards { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 420px) { .setup .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="hud" class="hidden">
  <div id="top"></div>
  <div id="banners"></div>
  <div id="panel" class="hidden"></div>
  <div id="chips"></div>
  <button id="endturn" data-act="endturn" title="Volgende beurt (Enter)"></button>
  <div id="leftBtns">
    <button class="btn icon" data-act="focuscap" title="Hoofdstad (H)">⌂</button>
    <button class="btn icon" data-act="zoomin" title="Inzoomen">+</button>
    <button class="btn icon" data-act="zoomout" title="Uitzoomen">−</button>
  </div>
</div>
<div id="toasts"></div>
<div id="title"></div>
<div id="modal" class="hidden"></div>
<script>
'use strict';
const GAME_VERSION = '1.5 · 2026-11-22 · b1938f8';
// ===================== NEVELKROON — statische speldata =====================

const RES_KEYS = ['E', 'M', 'R', 'I'];
const RES_NAMES = { E: 'Energie', M: 'Mineralen', R: 'Onderzoek', I: 'Invloed' };
const RES_ICONS = { E: '⚡', M: '⬢', R: '◈', I: '✦' };

// Faction definitions. Modifiers are additive multipliers (0.15 = +15%).
const FACTIONS = [
  {
    id: 'aurel', name: 'Aurelisch Verbond', short: 'Verbond', color: '#f2c14e', ship: 'arrow',
    pref: 'oceaan', aggression: 0.35, opinionGiven: 15,
    mods: { R: 0.15, I: 0.25, opinion: 15 },
    desc: 'Een democratisch verbond van kolonies die de oude Kroonarchieven bestuderen. Sterk in onderzoek en diplomatie.',
    traits: ['+15% onderzoek', '+25% invloed', 'Andere rijken mogen je (+15 opinie)'],
  },
  {
    id: 'zwerm', name: "Kh'arak Zwerm", short: 'Zwerm', color: '#e8553d', ship: 'claw',
    pref: 'woestijn', aggression: 0.75, opinionGiven: -20,
    mods: { M: 0.25, growth: 0.45, hull: 0.1, opinion: -20 },
    desc: 'Een insectoïde bijenkorf die elke wereld als broedplaats ziet. Groeit razendsnel en vreet planeten leeg.',
    traits: ['+25% mineralen', '+45% bevolkingsgroei', '+10% romp (chitinepantser)', 'Gewantrouwd (−20 opinie)'],
  },
  {
    id: 'synode', name: 'Lumen Synode', short: 'Synode', color: '#b07cff', ship: 'crystal',
    pref: 'ijs', aggression: 0.45, opinionGiven: 0,
    mods: { shield: 0.25, anomaly: 0.3, I: 0.15, R: 0.1 },
    desc: 'Kristallijne wezens met een gedeeld bewustzijn. Zij horen de Kroon zingen en willen haar wekken.',
    traits: ['+25% schilden', '+10% onderzoek', 'Betere anomalie-uitkomsten', '+15% invloed', 'Kroon-ontwaking 5 beurten korter'],
  },
  {
    id: 'tyr', name: 'Vrije Kartels van Tyr', short: 'Kartels', color: '#3fd0c9', ship: 'disc',
    pref: 'toendra', aggression: 0.4, opinionGiven: 5,
    mods: { E: 0.25, buildCost: -0.15, trade: 1 },
    desc: 'Een netwerk van handelshuizen. Alles heeft een prijs, ook vrede. Handelen tegen voordelige koersen.',
    traits: ['+25% energie', 'Gebouwen 15% goedkoper', 'Voordelige marktkoers'],
  },
  {
    id: 'ijzer', name: 'IJzeren Hegemonie', short: 'Hegemonie', color: '#6aa6ff', ship: 'blade',
    pref: 'aards', aggression: 0.9, opinionGiven: -10,
    mods: { weapon: 0.15, shipCost: -0.1, freeWar: 1, opinion: -10 },
    desc: 'Een gemilitariseerde cyborgstaat. Zij geloven dat alleen de sterkste de Kroon verdient.',
    traits: ['+15% wapenschade', 'Schepen 10% goedkoper', 'Oorlog verklaren kost geen invloed'],
  },
];

const PLANET_TYPES = {
  aards:    { name: 'Aards',       hab: 1.0, color: '#4f9d5d', color2: '#2f6fa8' },
  oceaan:   { name: 'Oceaan',      hab: 0.85, color: '#2a74c9', color2: '#1d4f8f' },
  woestijn: { name: 'Woestijn',    hab: 0.75, color: '#d39b4a', color2: '#a86e2d' },
  toendra:  { name: 'Toendra',     hab: 0.75, color: '#8a9e7a', color2: '#5e6f55' },
  ijs:      { name: 'IJs',         hab: 0.65, color: '#cfe8f5', color2: '#8fb7d0' },
  gaia:     { name: 'Gaia',        hab: 1.25, color: '#5fd17a', color2: '#2f9fbf' },
  kaal:     { name: 'Kaal',        hab: 0, color: '#8b8580', color2: '#5a5550', dep: { M: 1 } },
  gas:      { name: 'Gasreus',     hab: 0, color: '#c9a37a', color2: '#9a6f50', dep: { E: 1 } },
  asteroid: { name: 'Asteroïden',  hab: 0, color: '#7a7068', color2: '#4a4440', dep: { M: 2 } },
  lava:     { name: 'Lava',        hab: 0, color: '#d2502d', color2: '#6a1f12', dep: { M: 1 } },
};
const HABITABLE = ['aards', 'oceaan', 'woestijn', 'toendra', 'ijs', 'gaia'];

const STAR_TYPES = {
  geel:    { name: 'Gele ster',      color: '#ffe08a', r: 9,  weight: 30 },
  oranje:  { name: 'Oranje ster',    color: '#ffb36b', r: 8,  weight: 22 },
  rood:    { name: 'Rode dwerg',     color: '#ff7a5c', r: 6,  weight: 22 },
  wit:     { name: 'Witte ster',     color: '#eef4ff', r: 9,  weight: 10 },
  blauw:   { name: 'Blauwe reus',    color: '#8cc4ff', r: 12, weight: 8, dep: { E: 1 } },
  neutron: { name: 'Neutronenster',  color: '#c6e6ff', r: 5,  weight: 4, dep: { R: 2 } },
  gat:     { name: 'Zwart gat',      color: '#000000', r: 10, weight: 4, dep: { E: 2, R: 1 } },

// ---------- Deterministic RNG (mulberry32), state lives in G.rng ----------
function rnd(G) {
  G.rng = (G.rng + 0x6D2B79F5) | 0;
  let t = G.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rint = (G, a, b) => a + Math.floor(rnd(G) * (b - a + 1));
const pick = (G, arr) => arr[Math.floor(rnd(G) * arr.length)];
function shuffle(G, arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd(G) * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function wpick(G, items, wfn) {
  let tot = 0; for (const it of items) tot += Math.max(0, wfn(it));
  if (tot <= 0) return null;
  let r = rnd(G) * tot;
  for (const it of items) { r -= Math.max(0, wfn(it)); if (r <= 0) return it; }
  return items[items.length - 1];
}

// ---------- Geometry ----------
function segCross(a, b, c, d) {
  const o = (p, q, r) => Math.sign((q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x));
  if (a === c || a === d || b === c || b === d) return false;
  return o(a, b, c) !== o(a, b, d) && o(c, d, a) !== o(c, d, b);
}
function distPointSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ---------- Graph helpers ----------
function bfsDist(G, from) {
  const d = new Array(G.systems.length).fill(Infinity);
  const q = [from]; d[from] = 0;
  for (let i = 0; i < q.length; i++) {
    const s = q[i];
    for (const n of G.systems[s].lanes) if (d[n] === Infinity) { d[n] = d[s] + 1; q.push(n); }
  }
  return d;
}
function multiBfs(G, sources) {
  const d = new Array(G.systems.length).fill(Infinity);
  const q = [];
  for (const s of sources) { d[s] = 0; q.push(s); }
  for (let i = 0; i < q.length; i++) {
    const s = q[i];
    for (const n of G.systems[s].lanes) if (d[n] === Infinity) { d[n] = d[s] + 1; q.push(n); }
  }
  return d;
}
/** Shortest path (by jumps) excluding start. `avoid(sysId)` blocks intermediate nodes. Returns null if unreachable. */
function findPath(G, from, to, avoid) {
  if (from === to) return [];
  const prev = new Array(G.systems.length).fill(-1);
  prev[from] = from;
  const q = [from];
  for (let i = 0; i < q.length; i++) {
    const s = q[i];
    for (const n of G.systems[s].lanes) {
      if (prev[n] !== -1) continue;
      if (n !== to && avoid && avoid(n)) continue;
      prev[n] = s;
      if (n === to) {
        const path = [to];
        let c = s;
        while (c !== from) { path.unshift(c); c = prev[c]; }
        return path;
      }
      q.push(n);
    }
  }
  return null;
}
function isConnected(G) {
  const d = bfsDist(G, 0);
  return d.every(x => x < Infinity);
}

// ---------- Names ----------
function makeName(G, used) {
  for (let i = 0; i < 200; i++) {
    const n = pick(G, D.NAME_A) + pick(G, D.NAME_B) + (rnd(G) < 0.18 ? pick(G, D.NAME_C) : '');
    if (!used.has(n)) { used.add(n); return n; }
  }
  const n = 'Stelsel ' + used.size; used.add(n); return n;
}

// ---------- Galaxy generation ----------
function generateGalaxy(G, sizeKey) {
  const cfg = D.GALAXY_SIZES[sizeKey];
  if (!cfg) fail('Onbekende stelselgrootte');
  const { n, w, h } = cfg;
  G.w = w; G.h = h;
  const cx = w / 2, cy = h / 2;
  let minD = Math.sqrt(w * h / n) * 0.66;
  const pts = [];
  let attempts = 0;
  while (pts.length < n) {
    attempts++;
    if (attempts % 4000 === 0) minD *= 0.93;
    const r = Math.sqrt(rnd(G));
    if (r < 0.1) continue;
    const th = rnd(G) * Math.PI * 2;
    const arm = Math.cos(2 * (th - r * 3.2));
    if (rnd(G) > 0.4 + 0.6 * (arm + 1) / 2) continue;
    const p = { x: cx + r * Math.cos(th) * w * 0.46, y: cy + r * Math.sin(th) * h * 0.46 };
    if (pts.some(q => dist(p, q) < minD)) continue;
    pts.push(p);
  }
  const used = new Set();
  G.systems = pts.map((p, i) => ({
    id: i, x: Math.round(p.x), y: Math.round(p.y), name: makeName(G, used),
    star: 'geel', planets: [], lanes: [], owner: null, starbase: { level: 0, hp: 0 },
    dep: { E: 0, M: 0, R: 0 }, anomaly: false, relay: false, siege: null, blight: false,
  }));
  buildLanes(G, minD);
  for (const s of G.systems) populateSystem(G, s);
}

function buildLanes(G, minD) {
  const S = G.systems;
  const cand = [];
  for (let i = 0; i < S.length; i++) {
    const near = S.map((s, j) => [j, dist(S[i], s)]).filter(([j]) => j !== i).sort((a, b) => a[1] - b[1]).slice(0, 5);
    for (const [j, dd] of near) if (dd < minD * 2.4 && i < j) cand.push([i, j, dd]);
    for (const [j, dd] of near) if (dd < minD * 2.4 && j < i) cand.push([j, i, dd]);
  }
  const seen = new Set();
  const edges = [];
  cand.sort((a, b) => a[2] - b[2]);
  const ok = (i, j) => {
    for (const [a, b] of edges) if (segCross(S[i], S[j], S[a], S[b])) return false;
    for (const s of S) if (s.id !== i && s.id !== j && distPointSeg(s, S[i], S[j]) < minD * 0.28) return false;
    return true;
  };
  const add = (i, j) => { edges.push([i, j]); S[i].lanes.push(j); S[j].lanes.push(i); seen.add(i + '-' + j); };
  for (const [i, j] of cand) {
    if (seen.has(i + '-' + j)) continue;
    if (S[i].lanes.length >= 5 || S[j].lanes.length >= 5) continue;
    if (ok(i, j)) add(i, j);
  }
  // connect components
  for (let guard = 0; guard < 200 && !isConnected(G); guard++) {
    const d = bfsDist(G, 0);
    let best = null;
    for (let i = 0; i < S.length; i++) for (let j = 0; j < S.length; j++) {
      if (d[i] === Infinity || d[j] !== Infinity) continue;
      const dd = dist(S[i], S[j]);
      const pen = ok(i, j) ? 0 : 1e6;
      if (!best || dd + pen < best[2]) best = [i, j, dd + pen];
    }
    add(Math.min(best[0], best[1]), Math.max(best[0], best[1]));
  }
  // prune for chokepoints
  shuffle(G, edges);
  for (let k = edges.length - 1; k >= 0; k--) {
    const [a, b] = edges[k];
    if (S[a].lanes.length < 3 || S[b].lanes.length < 3 || rnd(G) > 0.3) continue;
    S[a].lanes = S[a].lanes.filter(x => x !== b); S[b].lanes = S[b].lanes.filter(x => x !== a);
    if (!isConnected(G)) { S[a].lanes.push(b); S[b].lanes.push(a); } else edges.splice(k, 1);
  }
  G.lanes = edges.map(([a, b]) => [a, b]);
}

const PLANET_WEIGHTS = { kaal: 22, gas: 15, asteroid: 10, lava: 8, aards: 4, oceaan: 6, woestijn: 7, toendra: 6, ijs: 7, gaia: 0.6 };
function populateSystem(G, s) {
  const st = wpick(G, Object.keys(D.STAR_TYPES), k => D.STAR_TYPES[k].weight);
  s.star = st;
  const np = rint(G, 1, 5);
  s.planets = [];
  for (let i = 0; i < np; i++) {
    let type = wpick(G, Object.keys(PLANET_WEIGHTS), k => PLANET_WEIGHTS[k]);
    if (st === 'gat' && D.HABITABLE.includes(type)) type = 'kaal';
    s.planets.push(makePlanet(G, s, type, i));
  }
  s.anomaly = rnd(G) < 0.3;
  recomputeDeposits(s);
}
function makePlanet(G, s, type, i) {
  const hab = D.HABITABLE.includes(type);
  return { type, size: hab ? (type === 'gaia' ? rint(G, 10, 13) : rint(G, 4, 10)) : rint(G, 3, 9), name: s.name + ' ' + D.ROMAN[i], colony: null, orbit: 24 + i * 13 + rint(G, 0, 4), phase: rnd(G) * Math.PI * 2 };
}
function recomputeDeposits(s) {
  const dep = { E: 0, M: 0, R: 0 };
  const sd = D.STAR_TYPES[s.star].dep || {};
  for (const k in sd) dep[k] += sd[k];
  for (const p of s.planets) {
    const pd = D.PLANET_TYPES[p.type].dep;
    if (pd) for (const k in pd) dep[k] += pd[k];
  }
  if (s.extraDep) for (const k in s.extraDep) dep[k] += s.extraDep[k];
  if (s.relay) { dep.E += 3; dep.R += 3; }
  if (s.blight) for (const k in dep) dep[k] = Math.floor(dep[k] / 2);
  s.dep = dep;
}

// ---------- Empire helpers ----------
const emp = (G, id) => G.empires[id];
const faction = (e) => D.FACTIONS.find(f => f.id === e.faction);
function recomputeMods(G, e) {
  const m = { E: 0, M: 0, R: 0, I: 0, weapon: 0, shield: 0, hull: 0, growth: 0, maxPop: 0, slots: 0, vision: 0, anomaly: 0, speed: 0, buildTime: 0, shipCost: 0, buildCost: 0, opinion: 0, trade: 0, freeWar: 0 };
  const f = faction(e);
  for (const k in f.mods) m[k] = (m[k] || 0) + f.mods[k];
  for (const t in e.techs) {
    const T = D.TECH_BY_ID[t];
    if (T) for (const k in T.eff) m[k] = (m[k] || 0) + T.eff[k];
  }
  const rep = e.repeat || 0;
  m.E += rep * 0.05; m.M += rep * 0.05; m.R += rep * 0.05; m.weapon += rep * 0.03; m.hull += rep * 0.03;
  if (e.bonus) for (const k in e.bonus) m[k] = (m[k] || 0) + e.bonus[k];
  if (e.edicts) for (const id in e.edicts) { const E = D.EDICTS[id]; for (const k in E.eff) m[k] = (m[k] || 0) + E.eff[k]; }
  e.mods = m;
}
function relation(G, a, b) { return G.empires[a].rel[b]; }
function atWar(G, a, b) {
  if (a === b) return false;
  if (a < 0 || b < 0) return true;
  return !!G.empires[a].rel[b].war;
}
/** Hostility: neutrals (-1) and crisis (-2) are hostile to every empire but not to each other. */
function hostile(G, a, b) {
  if (a === b) return false;
  if (a < 0 && b < 0) return false;
  return atWar(G, a, b);
}

function shipStats(G, empId, t) {
  if (D.SHIPS[t]) {
    const S = D.SHIPS[t];
    const m = empId >= 0 ? G.empires[empId].mods : null;
    return {
      atk: S.atk * (1 + (m ? m.weapon : 0)),
      hp: Math.round(S.hp * (1 + (m ? m.hull : 0))),
      sh: Math.round(S.sh * (1 + (m ? m.shield : 0))),
      ev: S.ev, civ: !!S.civ,
    };
  }
  const M = D.MONSTER_SHIPS[t];
  const sc = empId === -2 ? (G.crisis ? G.crisis.scale : 1) : 1;
  return { atk: M.atk * sc, hp: Math.round(M.hp * sc), sh: Math.round(M.sh * sc), ev: M.ev, civ: false, structure: !!M.structure };
}
function fleetArmed(G, f) { return f.ships.some(s => !(D.SHIPS[s.t] && D.SHIPS[s.t].civ)); }
function fleetIsCiv(f) { return f.ships.length > 0 && D.SHIPS[f.ships[0].t] && D.SHIPS[f.ships[0].t].civ; }
/** Lanchester-style combat strength: sqrt(totalAttack × totalDurability). */
function powerOf(G, ships, empId) {
  let a = 0, h = 0;
  let titan = false;
  for (const s of ships) {
    const st = shipStats(G, empId, s.t);
    if (st.civ) continue;
    a += st.atk; h += s.hp + st.sh;
    if (s.t === 'titaan') titan = true;
  }
  if (titan) a *= 1.15;
  return Math.sqrt(a * h);
}
function fleetPower(G, f) { return powerOf(G, f.ships, f.emp); }
function empirePower(G, empId) {
  let p = 0;
  for (const f of G.fleets) if (f.emp === empId) p += fleetPower(G, f);
  return p;
}
function starbasePower(G, s) {
  if (s.owner == null || s.starbase.level === 0 || s.starbase.hp <= 0) return 0;
  const sb = D.STARBASES[s.starbase.level];
  return Math.sqrt(sb.atk * s.starbase.hp);
}
/** Defensive strength hostile to `empId` present in system. */
function defenseAt(G, sysId, empId) {
  const ships = [];
  let extra = 0;
  for (const f of G.fleets) {
    if (f.sys !== sysId || !hostile(G, f.emp, empId)) continue;
    for (const s of f.ships) ships.push({ ...s, _e: f.emp });
  }
  // approximate: group by emp
  const byEmp = {};
  for (const s of ships) (byEmp[s._e] = byEmp[s._e] || []).push(s);
  let p = 0;
  for (const k in byEmp) p += powerOf(G, byEmp[k], +k);
  const s = G.systems[sysId];
  if (s.owner != null && hostile(G, s.owner, empId)) {
    extra += starbasePower(G, s);
    for (const c of coloniesIn(G, sysId)) if (c.gar > 0) extra += Math.sqrt((2 + c.pop * 0.8 + (c.buildings.includes('schild') ? 12 : 0)) * (c.gar + (c.buildings.includes('schild') ? 80 : 0)));
  }
  return p + extra;
}

function coloniesOf(G, empId) { return G.colonies.filter(c => c.emp === empId); }
function coloniesIn(G, sysId) { return G.colonies.filter(c => c.sys === sysId); }
function systemsOf(G, empId) { return G.systems.filter(s => s.owner === empId); }
function fleetsAt(G, sysId) { return G.fleets.filter(f => f.sys === sysId); }

function log(G, empId, text, type, sys) {
  G.log.push({ turn: G.turn, emp: empId, text, type: type || 'info', sys: sys == null ? null : sys });
  if (G.log.length > 400) G.log.splice(0, G.log.length - 400);
}
function notifyAll(G, text, type, sys) { log(G, -1, text, type, sys); }


// ===================== NEVELKROON — spelopzet, commando's en beurtverwerking =====================

// ---------- Setup ----------
/**
 * Create a new game state.
 * @param {{size:string, ais:number, difficulty:string, faction:string|null, seed:number, allAI?:boolean, empireName?:string}} opts
 */
function createGame(opts) {
  if (!D.GALAXY_SIZES[opts.size]) fail('Ongeldige grootte');
  if (!D.DIFFICULTY[opts.difficulty]) fail('Ongeldige moeilijkheid');
  if (!(opts.ais >= 1 && opts.ais <= 4)) fail('Aantal tegenstanders moet 1–4 zijn');
  const G = {
    version: 1, seed: opts.seed >>> 0, rng: opts.seed | 0, turn: 1,
    settings: { size: opts.size, ais: opts.ais, difficulty: opts.difficulty },
    systems: [], lanes: [], empires: [], colonies: [], fleets: [], nextId: 1,
    log: [], pending: [], crisis: null, kroon: null, dom: null, over: null, anim: null, playerId: opts.allAI ? -1 : 0,
  };
  generateGalaxy(G, opts.size);

  // factions
  const pool = shuffle(G, D.FACTIONS.map(f => f.id).filter(id => id !== opts.faction));
  const facs = opts.allAI ? pool.slice(0, opts.ais + 1) : [opts.faction, ...pool.slice(0, opts.ais)];
  if (!opts.allAI && !D.FACTIONS.some(f => f.id === opts.faction)) fail('Onbekende factie');

  // capitals: farthest-first by graph distance
  const cands = G.systems.filter(s => s.lanes.length >= 2).map(s => s.id);
  const caps = [pick(G, cands)];
  while (caps.length < facs.length) {
    const d = multiBfs(G, caps);
    let best = -1, bestD = -1;
    for (const c of cands) if (!caps.includes(c) && d[c] > bestD && d[c] < Infinity) { bestD = d[c]; best = c; }
    caps.push(best);
  }
  facs.forEach((fid, i) => {
    const f = D.FACTIONS.find(x => x.id === fid);
    const e = {
      id: i, faction: fid, name: (i === 0 && opts.empireName) ? opts.empireName : f.name, color: f.color,
      isPlayer: !opts.allAI && i === 0, alive: true,
      res: { E: 120, M: 160, R: 0, I: 15 }, income: { E: 0, M: 0, R: 0, I: 0 },
      techs: {}, research: { current: null, progress: 0, options: [] }, repeat: 0, bonus: {},
      known: {}, vis: {}, rel: {}, capital: caps[i], mods: null,
      stats: { lost: 0, killed: 0, captured: 0 }, score: [], edicts: {}, ai: { warTarget: null, lastWarCheck: 0 },
    };
    recomputeMods(G, e);
    G.empires.push(e);
  });
  for (const a of G.empires) for (const b of G.empires) if (a.id !== b.id)
    a.rel[b.id] = { war: false, pact: false, contact: false, mod: 0, warSince: 0, lastWar: -999, gifts: 0, warScore: 0 };

  for (const e of G.empires) setupCapital(G, e);
  placeRelays(G, caps);
  placeMonsters(G, caps);
  for (const e of G.empires) {
    rollTechOptions(G, e);
    updateVision(G, e);
    const d = bfsDist(G, e.capital);
    G.systems.forEach((s, i) => { if (d[i] <= 2 && !e.known[i]) e.known[i] = 1; });
    e.known[e.capital] = 2;
  }
  for (const f of G.fleets) if (f.auto) autoExplore(G, f);
  for (const e of G.empires) e.income = computeIncome(G, e);
  log(G, -1, 'De Kroonrelais ontwaken. De race om de Nevelkroon is begonnen.', 'big');
  return G;
}

function setupCapital(G, e) {
  const s = G.systems[e.capital];
  const f = faction(e);
  s.star = pick(G, ['geel', 'oranje', 'wit']);
  s.anomaly = false;
  s.planets = [
    makePlanet(G, s, f.pref, 0), makePlanet(G, s, 'kaal', 1), makePlanet(G, s, 'gas', 2), makePlanet(G, s, 'asteroid', 3),
  ];
  s.planets[0].size = 16;
  s.planets[0].name = s.name + ' Prime';
  recomputeDeposits(s);
  s.owner = e.id;
  s.starbase = { level: 2, hp: D.STARBASES[2].hp };
  const c = { id: G.nextId++, emp: e.id, sys: s.id, pi: 0, pop: 8, buildings: ['kern', 'mijn', 'centrale', 'lab', 'werf'], bq: [], sq: [], cap: true, gar: 160 };
  s.planets[0].colony = c.id;
  G.colonies.push(c);
  e.known[s.id] = 2;
  // fairness: at least 2 habitable planets within 2 jumps, and a few claimable systems around
  const d = bfsDist(G, s.id);
  const near = G.systems.filter(x => d[x.id] >= 1 && d[x.id] <= 2 && x.owner == null && x.star !== 'gat');
  let habs = near.reduce((n, x) => n + x.planets.filter(p => D.HABITABLE.includes(p.type)).length, 0);
  for (const x of shuffle(G, near.slice())) {
    if (habs >= 3) break;
    if (x.planets.length >= 6) continue;
    const type = rnd(G) < 0.5 ? f.pref : pick(G, ['aards', 'oceaan', 'woestijn', 'toendra', 'ijs']);
    x.planets.push(makePlanet(G, x, type, x.planets.length));
    x.planets[x.planets.length - 1].size = rint(G, 6, 10);
    habs++;
  }
  spawnFleet(G, e.id, s.id, [{ t: 'verkenner' }], { auto: true });
  spawnFleet(G, e.id, s.id, [{ t: 'verkenner' }], { auto: true });
  spawnFleet(G, e.id, s.id, [{ t: 'bouwschip' }]);
  spawnFleet(G, e.id, s.id, [{ t: 'korvet' }, { t: 'korvet' }, { t: 'korvet' }]);
}

function placeRelays(G, caps) {
  const n = { klein: 4, middel: 5, groot: 6 }[G.settings.size];
  const relays = [];
  for (let k = 0; k < n; k++) {
    const d = multiBfs(G, [...caps, ...relays]);
    const dc = multiBfs(G, caps);
    let best = -1, bestV = -1;
    for (const s of G.systems) {
      if (s.owner != null || relays.includes(s.id) || dc[s.id] < 3) continue;
      const v = d[s.id] + rnd(G) * 0.5;
      if (v > bestV) { bestV = v; best = s.id; }
    }
    if (best < 0) break;
    relays.push(best);
    const s = G.systems[best];
    s.relay = true; s.anomaly = false;
    recomputeDeposits(s);
    spawnMonster(G, best, 'wachter');
  }
  G.relays = relays;
}
function placeMonsters(G, caps) {
  const dc = multiBfs(G, caps);
  const free = G.systems.filter(s => !s.relay && s.owner == null && dc[s.id] >= 3);
  for (const s of free) if (rnd(G) < 0.12) spawnMonster(G, s.id, 'kristal');
  // pirate bases: 3–5 jumps from the nearest capital, so they are met while expanding
  const pirSpots = shuffle(G, free.filter(s => dc[s.id] >= 3 && dc[s.id] <= 5 && !G.fleets.some(f => f.sys === s.id)));
  const placed = [];
  for (const s of pirSpots) {
    if (placed.length >= D.RULES.pirateBases[G.settings.size]) break;
    if (placed.some(p => bfsDist(G, p)[s.id] < 3)) continue;
    const b = spawnMonster(G, s.id, 'piratenbasis');
    b.pirTimer = D.RULES.pirateFirstRaid + rint(G, 0, 6);
    placed.push(s.id);
  }
  if (G.settings.size !== 'klein') {
    const far = free.filter(s => !G.fleets.some(f => f.sys === s.id)).sort((a, b) => dc[b.id] - dc[a.id])[0];
    if (far) {
      spawnMonster(G, far.id, 'draak');
      far.planets.push(makePlanet(G, far, 'gaia', far.planets.length));
      far.extraDep = { E: 3, M: 3, R: 3 };
      recomputeDeposits(far);
    }
  }
}

function spawnFleet(G, empId, sysId, shipList, extra) {
  const f = { id: G.nextId++, emp: empId, sys: sysId, prev: sysId, ships: [], path: [], order: null, prog: 0, auto: false, ...extra };
  for (const sh of shipList) f.ships.push({ t: sh.t, hp: shipStats(G, empId, sh.t).hp });
  G.fleets.push(f);
  return f;
}
function spawnMonster(G, sysId, type) {
  const M = D.MONSTERS[type];
  const list = [];
  for (const [t, n] of M.ships) for (let i = 0; i < n; i++) list.push({ t });
  return spawnFleet(G, -1, sysId, list, { monster: type, loot: { ...M.loot } });
}

// ---------- Economy ----------
function colonyMaxPop(G, c) {
  const p = G.systems[c.sys].planets[c.pi];
  const e = G.empires[c.emp];
  const pt = D.PLANET_TYPES[p.type];
  let hab = pt.hab;
  if (faction(e).pref === p.type) hab += 0.2;
  let m = p.size * hab * (1 + e.mods.maxPop);
  if (c.buildings.includes('habitat')) m += 3;
  return Math.max(2, Math.round(m));
}
function colonySlots(G, c) {
  const e = G.empires[c.emp];
  return Math.min(8, 2 + Math.floor(c.pop / 3) + (e.mods.slots || 0));
}
function usedSlots(c) {
  return c.buildings.filter(b => !D.BUILDINGS[b].noSlot).length + c.bq.length;
}
/** Net per-turn income (after modifiers and upkeep). Pure w.r.t. G. */
function computeIncome(G, e) {
  const gross = { E: 0, M: 0, R: 0, I: 3 };
  let upkeep = 0;
  for (const c of G.colonies) {
    if (c.emp !== e.id) continue;
    const pop = Math.floor(c.pop);
    const eff = c.unrest > 0 ? 0.5 : 1;
    gross.E += pop * 0.5 * eff; gross.M += pop * 0.5 * eff; gross.R += pop * 0.35 * eff;
    for (const b of c.buildings) {
      const B = D.BUILDINGS[b];
      for (const k in B.out) gross[k] += B.out[k] * eff;
      upkeep += B.up;
    }
  }
  for (const s of G.systems) {
    if (s.owner !== e.id) continue;
    for (const k in s.dep) gross[k] += s.dep[k];
    upkeep += D.STARBASES[s.starbase.level] ? D.STARBASES[s.starbase.level].up : 0;
  }
  for (const f of G.fleets) {
    if (f.emp !== e.id) continue;
    for (const sh of f.ships) upkeep += D.SHIPS[sh.t].up;
  }
  const aiMul = e.isPlayer ? 1 : D.DIFFICULTY[G.settings.difficulty].ai;
  const out = {};
  for (const k of D.RES_KEYS) out[k] = gross[k] * (1 + (e.mods[k] || 0)) * (k === 'I' ? 1 : aiMul);
  out.E -= upkeep;
  if (e.res.E < 0) { out.M *= 0.7; out.R *= 0.7; }
  for (const k of D.RES_KEYS) out[k] = Math.round(out[k] * 10) / 10;
  out.upkeep = Math.round(upkeep * 10) / 10;
  return out;
}

// ---------- Costs ----------
function buildingCost(G, e, b) { return Math.round(D.BUILDINGS[b].cost * (1 + (e.mods.buildCost || 0))); }
function buildingTurns(G, e, b) { return Math.max(1, D.BUILDINGS[b].turns - (e.mods.buildTime || 0)); }
function shipCost(G, e, t) { return Math.round(D.SHIPS[t].cost * (1 + (e.mods.shipCost || 0))); }
function shipTurns(G, e, t) { return Math.max(1, D.SHIPS[t].turns - (e.mods.buildTime || 0)); }
function outpostCostI(G, e) { return D.RULES.outpostBaseI + Math.floor(systemsOf(G, e.id).length / D.RULES.outpostPerSystems); }
function techCost(G, e, id) {
  if (id === 'rep') return Math.round(D.TECH_COST[5] * (1 + 0.25 * (e.repeat || 0)));
  const T = D.TECH_BY_ID[id];
  return Math.round(D.TECH_COST[T.tier] * (1 + 0.025 * Object.keys(e.techs).length));
}

// ---------- Research ----------
function availableTechs(G, e) {
  return D.TECHS.filter(t => !e.techs[t.id] && (t.req || []).every(r => e.techs[r]));
}
function rollTechOptions(G, e) {
  const av = availableTechs(G, e);
  const opts = [];
  // one per category if possible, prefer lower tiers
  const pool = shuffle(G, av.slice());
  for (const cat of shuffle(G, ['ph', 'en', 'so'])) {
    const c = pool.filter(t => t.cat === cat && !opts.includes(t.id));
    if (!c.length) continue;
    const t = wpick(G, c, x => 1 / x.tier);
    opts.push(t.id);
  }
  while (opts.length < 3) {
    const rest = pool.filter(t => !opts.includes(t.id));
    if (!rest.length) break;
    opts.push(wpick(G, rest, x => 1 / x.tier).id);
  }
  if (opts.length < 3) opts.push('rep');
  e.research.options = opts.slice(0, 3);
}
function chooseResearch(G, empId, id) {
  const e = G.empires[empId];
  if (!e.research.options.includes(id)) fail('Deze technologie is nu niet beschikbaar');
  e.research.current = id;
}
function completeResearch(G, e, id) {
  if (id === 'rep') { e.repeat = (e.repeat || 0) + 1; }
  else e.techs[id] = true;
  recomputeMods(G, e);
  e.research.current = null;
  rollTechOptions(G, e);
  const name = id === 'rep' ? 'Doorbraak ' + e.repeat : D.TECH_BY_ID[id].name;
  log(G, e.id, 'Onderzoek voltooid: ' + name, 'tech');
  if (id === 'ph_relay') for (const r of G.relays) if (!e.known[r]) e.known[r] = 1;
  // heal ships to new max is not automatic; new hull applies to repairs
}

// ---------- Commands (player + AI) ----------
function getColony(G, id) { const c = G.colonies.find(x => x.id === id); if (!c) fail('Kolonie bestaat niet'); return c; }
function getFleet(G, id) { const f = G.fleets.find(x => x.id === id); if (!f) fail('Vloot bestaat niet'); return f; }

function canBuild(G, c, b) {
  const e = G.empires[c.emp];
  const B = D.BUILDINGS[b];
  if (!B || B.hidden) return 'Onbekend gebouw';
  if (B.req && !e.techs[B.req]) return 'Vereist ' + D.TECH_BY_ID[B.req].name;
  if (B.unique && (c.buildings.includes(b) || c.bq.some(q => q.id === b))) return 'Al aanwezig';
  if (usedSlots(c) >= colonySlots(G, c)) return 'Geen vrije bouwplaats';
  if (e.res.E < buildingCost(G, e, b)) return 'Te weinig energie';
  return null;
}
function queueBuilding(G, colonyId, b) {
  const c = getColony(G, colonyId);
  const why = canBuild(G, c, b);
  if (why) fail(why);
  const e = G.empires[c.emp];
  const cost = buildingCost(G, e, b);
  e.res.E -= cost;
  c.bq.push({ id: b, left: buildingTurns(G, e, b), paid: cost });
}
function canBuildShip(G, c, t) {
  const e = G.empires[c.emp];
  const S = D.SHIPS[t];
  if (!S) return 'Onbekend schip';
  if (!c.buildings.includes('werf')) return 'Vereist een scheepswerf';
  if (S.req && !e.techs[S.req]) return 'Vereist ' + D.TECH_BY_ID[S.req].name;
  if (S.unique && (G.fleets.some(f => f.emp === e.id && f.ships.some(s => s.t === t)) || G.colonies.some(x => x.emp === e.id && x.sq.some(q => q.id === t)))) return 'Maximaal één';
  if (c.sq.length >= 5) return 'Wachtrij vol';
  if (e.res.M < shipCost(G, e, t)) return 'Te weinig mineralen';
  if (S.costI && e.res.I < S.costI) return 'Te weinig invloed';
  return null;
}
function queueShip(G, colonyId, t) {
  const c = getColony(G, colonyId);
  const why = canBuildShip(G, c, t);
  if (why) fail(why);
  const e = G.empires[c.emp];
  const cost = shipCost(G, e, t);
  e.res.M -= cost;
  if (D.SHIPS[t].costI) e.res.I -= D.SHIPS[t].costI;
  c.sq.push({ id: t, left: shipTurns(G, e, t), paid: cost, paidI: D.SHIPS[t].costI || 0 });
}
function cancelQueue(G, colonyId, kind, idx) {
  const c = getColony(G, colonyId);
  const q = kind === 'b' ? c.bq : c.sq;
  if (!q[idx]) fail('Niets om te annuleren');
  const it = q.splice(idx, 1)[0];
  const e = G.empires[c.emp];
  if (kind === 'b') e.res.E += it.paid; else { e.res.M += it.paid; e.res.I += it.paidI || 0; }
}

function civAvoid(G, empId) {
  return (sid) => G.fleets.some(f => f.sys === sid && f.emp !== empId && hostile(G, f.emp, empId) && fleetArmed(G, f))
    || (G.systems[sid].owner != null && hostile(G, G.systems[sid].owner, empId) && G.systems[sid].starbase.hp > 0);
}
function knownAvoid(G, empId, base) {
  const e = G.empires[empId];
  return (sid) => (e.isPlayer && !e.known[sid]) || (base && base(sid));
}
function moveFleet(G, fleetId, target, keepOrder) {
  const f = getFleet(G, fleetId);
  if (f.emp < 0) fail('Geen eigen vloot');
  if (target === f.sys) { f.path = []; if (!keepOrder) f.order = null; return []; }
  const e = G.empires[f.emp];
  if (e.isPlayer && !e.known[target]) fail('Dit stelsel is onbekend');
  const avoid = fleetIsCiv(f) ? civAvoid(G, f.emp) : null;
  let p = findPath(G, f.sys, target, knownAvoid(G, f.emp, avoid));
  if (!p && avoid) p = findPath(G, f.sys, target, knownAvoid(G, f.emp, null));
  if (!p) fail('Geen route naar dit stelsel');
  f.path = p;
  if (!keepOrder) { f.order = null; f.auto = false; }
  f.prog = 0;
  return p;
}
/** A scout has work in a system if it is uncharted or still holds an unexplored anomaly. */
function needsSurvey(G, empId, sysId) {
  return G.empires[empId].known[sysId] !== 2 || G.systems[sysId].anomaly;
}
function orderSurvey(G, fleetId, target) {
  const f = getFleet(G, fleetId);
  if (f.ships[0].t !== 'verkenner') fail('Alleen verkenners kunnen verkennen');
  if (!needsSurvey(G, f.emp, target)) fail('Al verkend, geen anomalie');
  moveFleet(G, fleetId, target, true);
  f.order = { type: 'survey', target };
}
function canOutpost(G, empId, sysId) {
  const e = G.empires[empId];
  const s = G.systems[sysId];
  if (s.owner != null) return 'Stelsel is al geclaimd';
  if (e.known[sysId] !== 2) return 'Stelsel eerst verkennen';
  if (G.fleets.some(f => f.sys === sysId && f.emp < 0)) return 'Er zijn vijandige wezens aanwezig';
  if (G.fleets.some(f => f.emp === empId && f.order && f.order.type === 'outpost' && f.order.target === sysId)) return 'Er is al een bouwschip onderweg';
  if (e.res.M < D.RULES.outpostCostM) return 'Te weinig mineralen';
  if (e.res.I < outpostCostI(G, e)) return 'Te weinig invloed';
  return null;
}
function orderOutpost(G, fleetId, target) {
  const f = getFleet(G, fleetId);
  if (f.ships[0].t !== 'bouwschip') fail('Alleen bouwschepen bouwen buitenposten');
  if (f.order && f.order.paid) fail('Dit bouwschip heeft al een bouwopdracht');
  const why = canOutpost(G, f.emp, target);
  if (why) fail(why);
  const e = G.empires[f.emp];
  moveFleet(G, fleetId, target, true);
  const ci = outpostCostI(G, e);
  e.res.M -= D.RULES.outpostCostM; e.res.I -= ci;
  f.order = { type: 'outpost', target, paid: { M: D.RULES.outpostCostM, I: ci } };
  f.prog = 0;
}
function canUpgrade(G, empId, sysId) {
  const e = G.empires[empId];
  const s = G.systems[sysId];
  if (s.owner !== empId) return 'Niet jouw stelsel';
  const nx = D.STARBASES[s.starbase.level + 1];
  if (!nx) return 'Maximaal niveau';
  if (!e.techs[nx.req]) return 'Vereist ' + D.TECH_BY_ID[nx.req].name;
  if (e.res.M < nx.cost) return 'Te weinig mineralen';
  if (G.fleets.some(f => f.emp === empId && f.order && f.order.type === 'upgrade' && f.order.target === sysId)) return 'Er wordt al geüpgraded';
  return null;
}
function orderUpgrade(G, fleetId, target) {
  const f = getFleet(G, fleetId);
  if (f.ships[0].t !== 'bouwschip') fail('Alleen bouwschepen kunnen upgraden');
  if (f.order && f.order.paid) fail('Dit bouwschip heeft al een bouwopdracht');
  const why = canUpgrade(G, f.emp, target);
  if (why) fail(why);
  const nx = D.STARBASES[G.systems[target].starbase.level + 1];
  moveFleet(G, fleetId, target, true);
  G.empires[f.emp].res.M -= nx.cost;
  f.order = { type: 'upgrade', target, paid: { M: nx.cost, I: 0 } };
  f.prog = 0;
}
function canColonize(G, empId, sysId, pi) {
  const s = G.systems[sysId];
  const e = G.empires[empId];
  const p = s.planets[pi];
  if (!p) return 'Planeet bestaat niet';
  if (!D.HABITABLE.includes(p.type)) return 'Niet bewoonbaar';
  if (p.colony) return 'Al gekoloniseerd';
  if (s.owner != null && s.owner !== empId) return 'Stelsel is van een ander rijk';
  if (e.known[sysId] !== 2) return 'Stelsel eerst verkennen';
  if (G.fleets.some(f => f.sys === sysId && f.emp < 0)) return 'Er zijn vijandige wezens aanwezig';
  if (G.fleets.some(f => f.emp === empId && f.order && f.order.type === 'colonize' && f.order.target === sysId && f.order.pi === pi)) return 'Er is al een kolonieschip onderweg';
  return null;
}
function orderColonize(G, fleetId, target, pi) {
  const f = getFleet(G, fleetId);
  if (f.ships[0].t !== 'kolonie') fail('Alleen kolonieschepen koloniseren');
  const why = canColonize(G, f.emp, target, pi);
  if (why) fail(why);
  moveFleet(G, fleetId, target, true);
  f.order = { type: 'colonize', target, pi };
}
function cancelOrder(G, fleetId) {
  const f = getFleet(G, fleetId);
  if (f.order && f.order.paid) {
    const e = G.empires[f.emp];
    e.res.M += f.order.paid.M; e.res.I += f.order.paid.I;
  }
  f.order = null; f.path = []; f.auto = false; f.prog = 0;
}
function setAuto(G, fleetId, on) {
  const f = getFleet(G, fleetId);
  if (f.ships[0].t !== 'verkenner') fail('Automatisch verkennen kan alleen met een verkenner');
  f.auto = !!on;
  if (on && !f.order) autoExplore(G, f);
}
function mergeFleets(G, sysId, empId) {
  const fs = G.fleets.filter(f => f.sys === sysId && f.emp === empId && !fleetIsCiv(f));
  if (fs.length < 2) fail('Geen vloten om samen te voegen');
  const main = fs[0];
  for (const f of fs.slice(1)) { main.ships.push(...f.ships); }
  G.fleets = G.fleets.filter(f => !fs.slice(1).includes(f));
  main.path = [];
  return main;
}
function splitFleet(G, fleetId) {
  const f = getFleet(G, fleetId);
  if (fleetIsCiv(f) || f.ships.length < 2) fail('Kan niet splitsen');
  const half = f.ships.splice(Math.ceil(f.ships.length / 2));
  const nf = { id: G.nextId++, emp: f.emp, sys: f.sys, prev: f.sys, ships: half, path: [], order: null, prog: 0, auto: false };
  G.fleets.push(nf);
  return nf;
}

function autoExplore(G, f) {
  const e = G.empires[f.emp];
  const d = bfsDist(G, f.sys);
  const taken = new Set(G.fleets.filter(x => x !== f && x.emp === f.emp && x.order && x.order.type === 'survey').map(x => x.order.target));
  const avoid = civAvoid(G, f.emp);
  const cands = [];
  for (const s of G.systems) {
    if (!needsSurvey(G, f.emp, s.id) || taken.has(s.id) || d[s.id] === Infinity) continue;
    if (e.isPlayer && !e.known[s.id]) continue;
    if (avoid(s.id)) continue;
    cands.push({ id: s.id, v: d[s.id] + rnd(G) * 0.6 });
  }
  cands.sort((a, b) => a.v - b.v);
  for (const c of cands) {
    const p = findPath(G, f.sys, c.id, knownAvoid(G, f.emp, avoid));
    if (p) { f.path = p; f.order = { type: 'survey', target: c.id }; return true; }
  }
  f.order = null;
  // Stay on auto while survey work remains somewhere; new systems come into view every turn.
  const workLeft = G.systems.some(s => needsSurvey(G, f.emp, s.id) && d[s.id] < Infinity && !avoid(s.id));
  if (!workLeft) {
    f.auto = false;
    if (e.isPlayer) log(G, e.id, 'Een verkenner heeft niets meer te verkennen en wacht op orders.', 'info', f.sys);
  }
  return false;
}

// ---------- Diplomacy ----------
function opinion(G, a, b) {
  // how a feels about b
  if (a < 0 || b < 0) return -100;
  const ea = G.empires[a], eb = G.empires[b];
  const r = ea.rel[b];
  let o = eb.mods.opinion || 0;
  o += ea.mods.opinion ? Math.round(ea.mods.opinion / 3) : 0;
  o += r.mod;
  if (r.pact) o += 25;
  if (r.war) o -= 40;
  const since = G.turn - r.lastWar;
  if (since < 40) o -= Math.round(30 * (1 - since / 40));
  if (bordersTouch(G, a, b)) o -= 10;
  if (G.kroon && G.kroon.emp === b) o -= 100;
  if (G.dom && G.dom.emp === b) o -= 60;
  return Math.max(-100, Math.min(100, Math.round(o)));
}
function bordersTouch(G, a, b) {
  for (const s of G.systems) if (s.owner === a) for (const n of s.lanes) if (G.systems[n].owner === b) return true;
  return false;
}
function canDeclareWar(G, a, b) {
  const e = G.empires[a];
  const r = e.rel[b];
  if (!G.empires[b].alive) return 'Rijk bestaat niet meer';
  if (!r.contact) return 'Geen contact';
  if (r.war) return 'Al in oorlog';
  if (r.pact) return 'Eerst het verdrag opzeggen';
  if (G.turn - r.lastWar < 20) return 'Wapenstilstand nog ' + (20 - (G.turn - r.lastWar)) + ' beurten';
  if (!e.mods.freeWar && e.res.I < D.RULES.warCostI) return 'Te weinig invloed (' + D.RULES.warCostI + ')';
  return null;
}
function declareWar(G, a, b) {
  const why = canDeclareWar(G, a, b);
  if (why) fail(why);
  const e = G.empires[a];
  if (!e.mods.freeWar) e.res.I -= D.RULES.warCostI;
  setWar(G, a, b, true);
  notifyAll(G, e.name + ' verklaart de oorlog aan ' + G.empires[b].name + '!', 'war');
}
function setWar(G, a, b, on) {
  const ra = G.empires[a].rel[b], rb = G.empires[b].rel[a];
  ra.war = rb.war = on;
  if (on) { ra.warSince = rb.warSince = G.turn; ra.warScore = rb.warScore = 0; ra.pact = rb.pact = false; }
  else { ra.lastWar = rb.lastWar = G.turn; }
}
/** AI willingness to accept peace with `from`. */
function aiAcceptsPeace(G, ai, from) {
  const r = G.empires[ai].rel[from];
  const myP = empirePower(G, ai) + 1, theirP = empirePower(G, from) + 1;
  const dur = G.turn - r.warSince;
  if (G.kroon && G.kroon.emp === from) return false;
  if (G.dom && G.dom.emp === from) return false;
  if (dur < 8) return false;
  if (r.warScore < -15) return true;
  if (myP < theirP * 0.8) return true;
  if (dur > 30 && r.warScore < 20) return true;
  return false;
}
function proposePeace(G, a, b) {
  const r = G.empires[a].rel[b];
  if (!r.war) fail('Niet in oorlog');
  const accepted = G.empires[b].isPlayer ? false : aiAcceptsPeace(G, b, a);
  if (accepted) { setWar(G, a, b, false); notifyAll(G, G.empires[a].name + ' en ' + G.empires[b].name + ' sluiten vrede.', 'peace'); }
  return accepted;
}
function aiAcceptsPact(G, ai, from) { return opinion(G, ai, from) >= 20 && !G.empires[ai].rel[from].war; }
function proposePact(G, a, b) {
  const e = G.empires[a];
  const r = e.rel[b];
  if (r.war) fail('Eerst vrede sluiten');
  if (r.pact) fail('Er is al een verdrag');
  if (!r.contact) fail('Geen contact');
  if (e.res.I < D.RULES.pactCostI) fail('Te weinig invloed (' + D.RULES.pactCostI + ')');
  const ok = aiAcceptsPact(G, b, a);
  if (ok) {
    e.res.I -= D.RULES.pactCostI;
    r.pact = G.empires[b].rel[a].pact = true;
    notifyAll(G, e.name + ' en ' + G.empires[b].name + ' sluiten een niet-aanvalsverdrag.', 'peace');
  }
  return ok;
}
function cancelPact(G, a, b) {
  const r = G.empires[a].rel[b];
  if (!r.pact) fail('Geen verdrag');
  r.pact = G.empires[b].rel[a].pact = false;
  G.empires[b].rel[a].mod -= 25;
  log(G, b, G.empires[a].name + ' heeft het verdrag met ons opgezegd.', 'war');
}
function sendGift(G, a, b) {
  const e = G.empires[a];
  if (e.res.E < D.RULES.giftE) fail('Te weinig energie');
  if (!e.rel[b].contact) fail('Geen contact');
  e.res.E -= D.RULES.giftE;
  G.empires[b].res.E += D.RULES.giftE;
  const r = G.empires[b].rel[a];
  r.mod += Math.max(3, 14 - r.gifts * 3);
  r.gifts++;
}
function marketTrade(G, empId, from, amount) {
  const e = G.empires[empId];
  if (!['E', 'M'].includes(from)) fail('Ongeldige handel');
  if (!(amount > 0) || e.res[from] < amount) fail('Te weinig ' + D.RES_NAMES[from].toLowerCase());
  const rate = e.mods.trade ? D.RULES.marketRateTyr : D.RULES.marketRate;
  const to = from === 'E' ? 'M' : 'E';
  e.res[from] -= amount;
  e.res[to] += Math.floor(amount / rate);
}

// ---------- Edicts ----------
function canEdict(G, empId, id) {
  const e = G.empires[empId];
  const E = D.EDICTS[id];
  if (!E) return 'Onbekend edict';
  if (e.edicts[id]) return 'Al actief';
  if (e.res.I < E.cost) return 'Te weinig invloed (' + E.cost + ')';
  return null;
}
function enactEdict(G, empId, id) {
  const why = canEdict(G, empId, id);
  if (why) fail(why);
  const e = G.empires[empId];
  e.res.I -= D.EDICTS[id].cost;
  e.edicts[id] = D.EDICTS[id].turns;
  recomputeMods(G, e);
}
function shipyardSlots(G, e) { return 2 + (e.techs.en_automation ? 1 : 0); }

// ---------- Kroon victory ----------
function relaysNeeded(G) { return Math.max(2, Math.ceil(G.relays.length / 2)); }
function relaysHeld(G, empId) { return G.relays.filter(r => G.systems[r].owner === empId).length; }
function canStartKroon(G, empId) {
  const e = G.empires[empId];
  if (G.kroon) return 'De Kroon wordt al gewekt';
  if (!e.techs.ph_kroon) return 'Vereist De Kroonsleutel';

      }
    } else if (o.type === 'colonize') {
      const why = (() => { const p = s.planets[o.pi]; if (!p || p.colony) return 1; if (s.owner != null && s.owner !== e.id) return 1; if (G.fleets.some(x => x.sys === s.id && x.emp < 0)) return 1; return 0; })();
      if (why) { f.order = null; log(G, e.id, 'Kolonisatie bij ' + s.name + ' mislukt.', 'info', s.id); continue; }
      const c = { id: G.nextId++, emp: e.id, sys: s.id, pi: o.pi, pop: 1, buildings: [], bq: [], sq: [], cap: false, gar: 20 };
      G.colonies.push(c);
      s.planets[o.pi].colony = c.id;
      if (s.owner == null) { s.owner = e.id; s.starbase = { level: 1, hp: D.STARBASES[1].hp }; }
      remove.push(f);
      log(G, e.id, 'Nieuwe kolonie gesticht op ' + s.planets[o.pi].name + '!', 'colony', s.id);
    }
  }
  if (remove.length) G.fleets = G.fleets.filter(f => !remove.includes(f));
}

// ---------- Economy ----------
function economyPhase(G) {
  for (const e of G.empires) {
    if (!e.alive) continue;
    const inc = computeIncome(G, e);
    e.income = inc;
    e.res.E += inc.E; e.res.M += inc.M; e.res.I += inc.I;
    e.research.progress += inc.R;
    // research
    let guard = 0;
    while (e.research.current && e.research.progress >= techCost(G, e, e.research.current) && guard++ < 3) {
      e.research.progress -= techCost(G, e, e.research.current);
      completeResearch(G, e, e.research.current);
      if (!e.isPlayer) aiChooseResearch(G, e);
    }
    // colonies
    for (const c of G.colonies) {
      if (c.emp !== e.id) continue;
      const mx = colonyMaxPop(G, c);
      if (c.pop < mx) {
        const g = (0.16 + 0.035 * c.pop) * (1 + (e.mods.growth || 0)) * Math.max(0.15, 1 - c.pop / mx);
        c.pop = Math.min(mx, c.pop + g);
      } else if (c.pop > mx) c.pop = Math.max(mx, c.pop - 0.2);
      if (c.unrest > 0) c.unrest--;
      const s = G.systems[c.sys];
      const sieged = s.siege != null;
      if (c.bq.length && !sieged) {
        c.bq[0].left--;
        if (c.bq[0].left <= 0) {
          const b = c.bq.shift().id;
          c.buildings.push(b);
          if (e.isPlayer) log(G, e.id, D.BUILDINGS[b].name + ' voltooid op ' + s.planets[c.pi].name + '.', 'build', c.sys);
        }
      }
      if (c.sq.length && !sieged && c.buildings.includes('werf')) {
        const n = Math.min(c.sq.length, shipyardSlots(G, e));
        for (let i = 0; i < n; i++) c.sq[i].left--;
        const done = c.sq.filter((q, i) => i < n && q.left <= 0);
        c.sq = c.sq.filter(q => !done.includes(q));
        for (const q of done) deliverShip(G, e, c.sys, q.id);
      }
    }
    // edicts tick down
    let edChanged = false;
    for (const id in e.edicts) { if (--e.edicts[id] <= 0) { delete e.edicts[id]; edChanged = true; if (e.isPlayer) log(G, e.id, 'Edict verlopen: ' + D.EDICTS[id].name, 'info'); } }
    if (edChanged) recomputeMods(G, e);
    // energy debt consequences: lose a random building's output is too harsh; instead clamp minerals stock
    if (e.res.E < -50) e.res.E = -50;
    if (e.res.I < 0) e.res.I = 0;
  }
}
function deliverShip(G, e, sysId, t) {
  if (D.SHIPS[t].civ) {
    const f = spawnFleet(G, e.id, sysId, [{ t }]);
    if (t === 'verkenner' && e.isPlayer) { f.auto = true; autoExplore(G, f); }
  } else {
    const host = G.fleets.find(f => f.emp === e.id && f.sys === sysId && !fleetIsCiv(f) && !f.path.length && f.home);
    if (host) host.ships.push({ t, hp: shipStats(G, e.id, t).hp });
    else spawnFleet(G, e.id, sysId, [{ t }], { home: true });
  }
  if (e.isPlayer) log(G, e.id, D.SHIPS[t].name + ' van de werf bij ' + G.systems[sysId].name + '.', 'build', sysId);
}

// ---------- Diplomacy upkeep ----------
function diplomacyPhase(G) {
  for (const e of G.empires) {
    if (!e.alive) continue;
    for (const k in e.rel) {
      const r = e.rel[k];
      r.mod *= 0.985;
      if (r.gifts > 0 && G.turn % 10 === 0) r.gifts--;
    }
  }
}
function contactPhase(G) {
  for (const a of G.empires) {
    if (!a.alive) continue;
    for (const b of G.empires) {
      if (a === b || !b.alive || a.rel[b.id].contact) continue;
      let seen = false;
      for (const sid in a.vis) {
        const s = G.systems[sid];
        if (s.owner === b.id || G.fleets.some(f => f.sys === +sid && f.emp === b.id)) { seen = true; break; }
      }
      if (seen) {
        a.rel[b.id].contact = true; b.rel[a.id].contact = true;
        log(G, a.id, 'Eerste contact met ' + b.name + '.', 'contact');
        log(G, b.id, 'Eerste contact met ' + a.name + '.', 'contact');
        // reveal home
        if (!a.known[b.capital]) a.known[b.capital] = 1;
        if (!b.known[a.capital]) b.known[a.capital] = 1;
      }
    }
  }
}

// ---------- Vision ----------
function updateVision(G, e) {
  const src = [];
  for (const s of G.systems) if (s.owner === e.id) src.push(s.id);
  const fleetSrc = G.fleets.filter(f => f.emp === e.id).map(f => f.sys);
  const range = 1 + (e.mods.vision || 0);
  const d1 = multiBfs(G, src);
  const d2 = multiBfs(G, fleetSrc);
  const vis = {};
  for (let i = 0; i < G.systems.length; i++) {
    if (d1[i] <= range || d2[i] <= 1) { vis[i] = 1; if (!e.known[i]) e.known[i] = 1; }
  }
  e.vis = vis;
}

// ---------- Random empire events ----------
function randomEvents(G) {
  for (const e of G.empires) {
    if (!e.alive || G.turn < 10) continue;
    if (rnd(G) < 0.04) {
      const ev = pick(G, D.EMPIRE_EVENTS);
      const msg = applyEffects(G, e, ev.fx, null);
      log(G, e.id, ev.title + ' — ' + ev.text + ' (' + msg + ')', 'event');
    }
  }
}

// ---------- Crisis ----------
function crisisPhase(G) {
  const T = D.RULES.crisisTurn;
  if (G.turn === T - 10) notifyAll(G, 'Wetenschappers melden vreemde zwaartekrachtgolven uit de lege ruimte tussen de sterren…', 'crisis');
  if (G.turn === T && !G.crisis) startCrisis(G);
  if (!G.crisis || G.crisis.over) return;
  const C = G.crisis;
  C.timer--;
  if (C.timer <= 0) {
    C.wave++;
    C.timer = D.RULES.crisisWaveEvery;
    C.scale = (C.base || 1) * (1 + 0.07 * Math.min(C.wave, 14)) * D.DIFFICULTY[G.settings.difficulty].crisis;
    for (const rf of G.fleets.filter(f => f.rift)) {
      const n = Math.round(2 + Math.min(C.wave, 12) * 0.7);
      const ships = [];
      for (let i = 0; i < n; i++) ships.push({ t: 'jager' });
      for (let i = 0; i < Math.min(4, Math.floor(C.wave / 3)); i++) ships.push({ t: 'verslinder' });
      spawnFleet(G, -2, rf.sys, ships, { crisis: true });
    }
    notifyAll(G, 'Nieuwe Leegte-vloten stromen uit de scheuren (golf ' + C.wave + ').', 'crisis');
  }
}
function startCrisis(G) {
  const n = { klein: 2, middel: 3, groot: 4 }[G.settings.size];
  const owned = G.systems.filter(s => s.owner != null).map(s => s.id);
  const d = multiBfs(G, owned);
  const capD = multiBfs(G, G.empires.filter(e => e.alive).map(e => e.capital));
  const cand = G.systems.filter(s => !s.relay && !coloniesIn(G, s.id).length && !G.fleets.some(f => f.sys === s.id && f.emp < 0) && capD[s.id] >= 2)
    .sort((a, b) => (b.owner == null) - (a.owner == null) || (d[b.id] + capD[b.id]) - (d[a.id] + capD[a.id]));
  const chosen = [];
  for (const s of cand) {
    if (chosen.length >= n) break;
    if (chosen.some(c => bfsDist(G, c)[s.id] < 3)) continue;
    chosen.push(s.id);
  }
  const alive = G.empires.filter(e => e.alive);
  const avgP = alive.reduce((a, e) => a + empirePower(G, e.id), 0) / Math.max(1, alive.length);
  const base = Math.max(1, Math.min(5, avgP / 1500));
  G.crisis = { wave: 0, timer: 1, base, scale: base * D.DIFFICULTY[G.settings.difficulty].crisis, rifts: chosen.length, over: false };
  if (!chosen.length) { G.crisis.over = true; return; }
  for (const sid of chosen) {
    const rs = G.systems[sid];
    if (rs.owner != null) { log(G, rs.owner, 'Een Leegtescheur verscheurt je buitenpost bij ' + rs.name + '!', 'crisis', sid); rs.owner = null; rs.starbase = { level: 0, hp: 0 }; }
    rs.blight = true; recomputeDeposits(rs);
    spawnFleet(G, -2, sid, [{ t: 'scheur' }], { rift: true, loot: { R: 400, I: 40, E: 300 } });
    for (const e of G.empires) if (e.alive) e.known[sid] = Math.max(e.known[sid] || 0, 1);
  }
  notifyAll(G, 'DE LEEGTE ONTWAAKT. Scheuren in de ruimte openen zich — hetzelfde kwaad dat de Kroon ooit vernietigde.', 'crisis');
}
function onRiftDestroyed(G, empId, f) {
  const C = G.crisis;
  if (!C) return;
  C.rifts--;
  G.empires[empId].rel; // noop
  notifyAll(G, G.empires[empId].name + ' heeft een Leegtescheur gesloten!', 'big', f.sys);
  if (C.rifts <= 0) {
    C.over = true;
    G.fleets = G.fleets.filter(x => x.emp !== -2);
    const e = G.empires[empId];
    e.bonus.R = (e.bonus.R || 0) + 0.1; e.bonus.weapon = (e.bonus.weapon || 0) + 0.1; recomputeMods(G, e);
    notifyAll(G, 'De Leegte is verslagen! ' + e.name + ' wordt geëerd als redder van de nevel (+10% onderzoek en wapens).', 'big');
  }
}
function crisisAI(G) {
  if (!G.crisis || G.crisis.over) return;
  const owned = G.systems.filter(s => s.owner != null).map(s => s.id);
  if (!owned.length) return;
  for (const f of G.fleets) {
    if (f.emp !== -2 || f.rift || f.path.length) continue;
    const s = G.systems[f.sys];
    if (s.owner != null) continue; // sieging
    const d = bfsDist(G, f.sys);
    let best = null, bv = Infinity;
    for (const o of owned) { const v = d[o] + rnd(G) * 1.5; if (v < bv) { bv = v; best = o; } }
    if (best != null) { const p = findPath(G, f.sys, best); if (p) f.path = p.slice(0, 3); }
  }
}

// ---------- Pirates ----------
function raidStrength(G) { return Math.min(10, 2 + Math.floor(G.turn / 18)); }
function pirateAI(G) {
  for (const base of G.fleets.filter(f => f.monster === 'piratenbasis')) {
    if (base.pirTimer == null) base.pirTimer = D.RULES.pirateFirstRaid;
    if (--base.pirTimer > 0) continue;
    base.pirTimer = rint(G, D.RULES.pirateRaidMin, D.RULES.pirateRaidMax);
    if (G.fleets.filter(f => f.raider && f.home === base.id).length >= D.RULES.pirateMaxRaiders) continue;
    const ships = [];
    for (let i = 0; i < raidStrength(G); i++) ships.push({ t: 'piraat' });
    spawnFleet(G, -1, base.sys, ships, { monster: 'rovers', raider: true, home: base.id, homeSys: base.sys, loot: { ...D.MONSTERS.rovers.loot }, raids: 0, wait: 0 });
  }
  for (const f of G.fleets) {
    if (!f.raider || f.path.length) continue;
    const s = G.systems[f.sys];
    const homeAlive = G.fleets.some(b => b.id === f.home);
    if (f.returning) {
      if (f.sys === f.homeSys) {
        if (homeAlive) { f.ships = []; continue; } // back inside the base
        f.returning = false; f.raider = false; continue; // base gone: stays as a roaming band
      }
      const p = findPath(G, f.sys, f.homeSys); if (p) f.path = p.slice(0, 1); else f.returning = false;
      continue;
    }
    if (s.owner != null) { if (++f.wait > 3) f.returning = true; continue; } // busy at a target
    const pw = fleetPower(G, f);
    const d = bfsDist(G, f.sys);
    let best = null, bv = -Infinity;
    for (const t of G.systems) {
      if (t.owner == null || d[t.id] > 5) continue;
      const def = defenseAt(G, t.id, -1);
      if (def > pw * 0.7) continue;
      const v = (coloniesIn(G, t.id).length ? 0 : 3) - d[t.id] + rnd(G);
      if (v > bv) { bv = v; best = t.id; }
    }
    if (best == null) { if (f.sys !== f.homeSys && homeAlive) f.returning = true; continue; }
    const p = findPath(G, f.sys, best);
    if (p) { f.path = p; f.wait = 0; }
  }
  G.fleets = G.fleets.filter(f => f.ships.length > 0);
}
function plunderPhase(G) {
  for (const f of G.fleets) {
    if (!f.raider || f.path.length || f.returning) continue;
    const s = G.systems[f.sys];
    if (s.owner == null) continue;
    const ownerArmed = G.fleets.some(o => o.sys === s.id && o.emp === s.owner && fleetArmed(G, o)) || (s.starbase.level > 0 && s.starbase.hp > 0) || coloniesIn(G, s.id).some(c => c.gar > 0);
    if (ownerArmed) continue;
    const e = G.empires[s.owner];
    const want = Math.round(25 + G.turn * 0.6);
    const tE = Math.max(0, Math.min(want, Math.floor(e.res.E))), tM = Math.max(0, Math.min(want, Math.floor(e.res.M)));
    e.res.E -= tE; e.res.M -= tM;
    f.loot.E = (f.loot.E || 0) + tE; f.loot.M = (f.loot.M || 0) + tM;
    log(G, e.id, 'Piraten plunderen ' + s.name + ': −' + tE + ' energie, −' + tM + ' mineralen.', 'war', s.id);
    if (++f.raids >= 2) f.returning = true;
  }
}

// ---------- Kroon ----------
function kroonPhase(G) {
  if (!G.kroon) return;
  const K = G.kroon;
  if (!G.empires[K.emp].alive || relaysHeld(G, K.emp) < relaysNeeded(G)) {
    notifyAll(G, 'Het ontwaken van de Kroon door ' + G.empires[K.emp].name + ' is onderbroken!', 'big');
    G.kroon = null; return;
  }
  K.left--;
  if (K.left <= 0) {
    G.over = { winner: K.emp, reason: 'kroon' };
    notifyAll(G, 'De Nevelkroon is ontwaakt. ' + G.empires[K.emp].name + ' heerst over de nevel.', 'big');
  }
}

// ---------- Victory ----------
function scoreOf(G, e) {
  if (!e.alive) return 0;
  let pop = 0; for (const c of G.colonies) if (c.emp === e.id) pop += c.pop;
  return systemsOf(G, e.id).length * 5 + pop * 2 + Object.keys(e.techs).length * 8 + (e.repeat || 0) * 8 + empirePower(G, e.id) * 0.15;
}
function victoryCheck(G) {
  if (G.over) return;
  const alive = G.empires.filter(e => e.alive);
  if (G.playerId >= 0 && !G.empires[G.playerId].alive) { G.over = { winner: null, reason: 'dood' }; return; }
  if (alive.length === 1) { G.over = { winner: alive[0].id, reason: 'verovering' }; return; }
  const total = G.systems.length;
  const dom = alive.find(e => systemsOf(G, e.id).length >= total * D.RULES.dominationShare);
  if (G.dom && (!dom || dom.id !== G.dom.emp)) {
    notifyAll(G, 'De overheersing van ' + G.empires[G.dom.emp].name + ' is gebroken.', 'big');
    G.dom = null;
  }
  if (dom && !G.dom) {
    G.dom = { emp: dom.id, left: D.RULES.dominationTurns };
    notifyAll(G, dom.name + ' beheerst ' + Math.round(D.RULES.dominationShare * 100) + '% van de nevel! Houden ze dit ' + D.RULES.dominationTurns + ' beurten vol, dan winnen ze.', 'big');
    for (const o of alive) if (o.id !== dom.id && !o.isPlayer) {
      o.rel[dom.id].contact = dom.rel[o.id].contact = true;
      if (!o.rel[dom.id].war) { setWar(G, o.id, dom.id, true); notifyAll(G, o.name + ' sluit zich aan bij de coalitie tegen ' + dom.name + '.', 'war'); }
    }
  } else if (G.dom) {
    if (--G.dom.left <= 0) { G.over = { winner: G.dom.emp, reason: 'dominantie' }; return; }
  }
  if (G.turn >= D.RULES.turnLimit) {
    const best = alive.sort((a, b) => scoreOf(G, b) - scoreOf(G, a))[0];
    G.over = { winner: best.id, reason: 'score' };
  }
}

// ===================== NEVELKROON — computertegenstanders =====================

function aiTurn(G, e) {
  if (!e.research.current) aiChooseResearch(G, e);
  aiMarket(G, e);
  aiEdicts(G, e);
  aiEconomy(G, e);
  aiShipyards(G, e);
  aiCivilians(G, e);
  aiMilitary(G, e);
  aiDiplomacy(G, e);
  if (!canStartKroon(G, e.id)) {
    const myP = empirePower(G, e.id);
    const others = G.empires.filter(o => o.alive && o.id !== e.id).reduce((a, o) => a + empirePower(G, o.id), 0);
    if (myP > others * 0.55 || relaysHeld(G, e.id) > relaysNeeded(G)) startKroon(G, e.id);
  }
}

function aiChooseResearch(G, e) {
  const f = faction(e);
  const relaysKnown = G.relays.some(r => e.known[r]);
  const opt = wpick(G, e.research.options, id => {
    if (id === 'rep') return 0.4;
    const T = D.TECH_BY_ID[id];
    let w = 1;
    if (T.cat === 'en') w += f.aggression;
    if (T.eff.E || T.eff.M || T.eff.R) w += 0.8;
    if (id === 'ph_relay' || id === 'ph_kroon') w += relaysKnown ? 2.5 : 0.5;
    if (['en_frigate', 'en_cruiser', 'en_battleship', 'en_titan'].includes(id)) w += 1 + f.aggression;
    if (id === 'en_starbase') w += 0.6;
    return w;
  });
  if (opt) e.research.current = opt;
}

function aiMarket(G, e) {
  const keepE = canStartKroon(G, e.id) === 'Te weinig energie (' + D.RULES.kroonCostE + ')' || e.techs.ph_kroon ? D.RULES.kroonCostE + 150 : 350;
  if (e.res.E < 20 && e.res.M > 250) marketTrade(G, e.id, 'M', 120);
  else if (e.res.E > keepE + 100) marketTrade(G, e.id, 'E', Math.floor(e.res.E - keepE));
}

function aiEdicts(G, e) {
  if (e.res.I < 90) return;
  const war = atWarAny(G, e);
  const pref = war ? ['oorlog', 'mijnbouw', 'energie'] : (e.income.E < 10 ? ['energie', 'mijnbouw', 'onderzoek'] : ['onderzoek', 'mijnbouw', 'groei', 'energie']);
  for (const id of pref) if (canEdict(G, e.id, id) == null) { enactEdict(G, e.id, id); return; }
}

function atWarAny(G, e) { return G.empires.some(o => o.alive && o.id !== e.id && e.rel[o.id].war); }

function aiEconomy(G, e) {
  const cols = coloniesOf(G, e.id).sort((a, b) => b.pop - a.pop);
  const nWerf = cols.filter(c => c.buildings.includes('werf') || c.bq.some(q => q.id === 'werf')).length;
  const war = atWarAny(G, e);
  for (const c of cols) {
    if (c.bq.length) continue;
    if (usedSlots(c) >= colonySlots(G, c)) continue;
    const mx = colonyMaxPop(G, c);
    const options = Object.keys(D.BUILDINGS).filter(b => canBuild(G, c, b) == null);
    if (!options.length) continue;
    const lowE = e.income.E < 4;
    const b = wpick(G, options, b => {
      switch (b) {
        case 'werf': return nWerf === 0 ? 100 : ((c.cap || (c.pop >= 5 && nWerf < 1 + Math.floor(cols.length / 2))) ? 12 : 0);
        case 'mijn': return lowE ? 0.5 : 3;
        case 'fabriek': return lowE ? 0.5 : 5;
        case 'centrale': return lowE ? 10 : 2;
        case 'reactor': return lowE ? 12 : 3;
        case 'lab': return lowE ? 0.3 : 2.5;
        case 'archief': return lowE ? 0.3 : 4;
        case 'habitat': return c.pop >= mx - 1 ? 5 : 0.5;
        case 'admin': return e.income.I < 5 ? 3 : 0.8;
        case 'schild': return war ? 2.5 : 0.2;
        default: return 1;
      }
    });
    if (!b) continue;
    if (e.res.E - buildingCost(G, e, b) < (b === 'werf' && nWerf === 0 ? 0 : 25)) continue;
    queueBuilding(G, c.id, b);
  }
}

function aiExpansionTargets(G, e) {
  const out = [];
  for (const s of G.systems) {
    if (s.owner != null || e.known[s.id] !== 2) continue;
    if (G.fleets.some(f => f.sys === s.id && f.emp < 0)) continue;
    if (!s.lanes.some(n => G.systems[n].owner === e.id)) continue;
    const habs = s.planets.filter(p => D.HABITABLE.includes(p.type) && !p.colony).length;
    const v = s.dep.E + s.dep.M + s.dep.R * 1.2 + habs * 2.5 + (s.relay ? 10 : 0) + 1;
    out.push({ sys: s.id, v });
  }
  return out;
}
function aiColonyTarget(G, e, excludeSet) {
  let best = null;
  const cap = e.capital;
  const d = bfsDist(G, cap);
  for (const s of G.systems) {
    if (e.known[s.id] !== 2) continue;
    if (s.owner != null && s.owner !== e.id) continue;
    if (s.owner == null && !s.lanes.some(n => G.systems[n].owner === e.id)) continue;
    if (G.fleets.some(f => f.sys === s.id && f.emp < 0)) continue;
    s.planets.forEach((p, pi) => {
      if (!D.HABITABLE.includes(p.type) || p.colony) return;
      if (excludeSet.has(s.id + ':' + pi)) return;
      let hab = D.PLANET_TYPES[p.type].hab + (faction(e).pref === p.type ? 0.2 : 0);
      const v = p.size * hab - d[s.id] * 0.4;
      if (!best || v > best.v) best = { sys: s.id, pi, v };

  return best;
}

function countShips(G, e, t) {
  let n = 0;
  for (const f of G.fleets) if (f.emp === e.id) for (const s of f.ships) if (s.t === t) n++;
  for (const c of G.colonies) if (c.emp === e.id) for (const q of c.sq) if (q.id === t) n++;
  return n;
}
function aiDesiredPower(G, e) {
  const f = faction(e);

  if (atWarAny(G, e)) target *= 1.5;
  for (const o of G.empires) {
    if (!o.alive || o.id === e.id || !e.rel[o.id].contact) continue;
    if (bordersTouch(G, e.id, o.id) || e.rel[o.id].war) target = Math.max(target, empirePower(G, o.id) * 0.9);

}
function aiShipyards(G, e) {
  const yards = coloniesOf(G, e.id).filter(c => c.buildings.includes('werf') && c.sq.length < shipyardSlots(G, e));
  if (!yards.length) return;
  const unsurveyed = G.systems.filter(s => needsSurvey(G, e.id, s.id)).length;
  const expansion = aiExpansionTargets(G, e).length;
  const nSys = systemsOf(G, e.id).length;
  const nCol = coloniesOf(G, e.id).length;
  const wantSci = unsurveyed > 0 ? (G.turn < 60 ? 2 : 1) : 0;
  const wantCon = Math.max(1, expansion > 0 ? Math.min(3, 1 + Math.floor(nSys / 10)) : 1);
  const colTarget = aiColonyTarget(G, e, new Set());
  const wantCol = colTarget && nCol < 3 + G.turn / 12 ? (colTarget.v > 6 ? 2 : 1) : 0;
  const myPower = empirePower(G, e.id);
  const desired = aiDesiredPower(G, e);
  for (const c of yards) {
    const tryQ = (t) => { if (canBuildShip(G, c, t) == null) { queueShip(G, c.id, t); return true; } return false; };
    if (countShips(G, e, 'verkenner') < wantSci && tryQ('verkenner')) continue;
    if (countShips(G, e, 'bouwschip') < wantCon && tryQ('bouwschip')) continue;
    if (countShips(G, e, 'kolonie') < wantCol && tryQ('kolonie')) continue;
    if (e.income.E < 1 && e.res.E < 100) continue;
    const surplus = e.res.M > 160 + 220 * (1 - faction(e).aggression);
    if (myPower >= desired && !surplus) continue;
    const unlocked = D.WARSHIPS.filter(t => !D.SHIPS[t].req || e.techs[D.SHIPS[t].req]);
    const best = unlocked.slice().reverse();
    const t = wpick(G, best, t => {
      const i = best.indexOf(t);
      if (t === 'titaan') return e.res.M > 1300 ? 6 : 0;
      return [4, 2, 1, 0.5, 0.3][i] || 0.3;

    if (t && e.res.M - shipCost(G, e, t) >= 30) tryQ(t);
